name: trigger

# Started by the playground dashboard (or by hand from the Actions tab).
# Obfuscated release build for Linux desktop, debug symbols to Sentry,
# then the app runs once under xvfb and sends one error.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "id that goes into the event (tag + fingerprint)"
        default: "manual"
      fresh:
        description: "new issue for this run"
        default: "true"
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      RUN_ID: ${{ inputs.run_id || format('push-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Linux desktop build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev xvfb

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: Build (obfuscated, symbols split out)
        run: flutter build linux --release --obfuscate --split-debug-info=build/symbols

      - name: Upload debug symbols + sources to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: dart run sentry_dart_plugin

      - name: Run once
        run: |
          FLAG=""
          [ "${{ inputs.fresh }}" = "false" ] && FLAG="--keep-issue"
          xvfb-run -a build/linux/x64/release/bundle/sentry_sample --run "$RUN_ID" $FLAG
